services:
  - type: web
    name: silver-empire
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --bind 0.0.0.0:$PORT
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: PRODUCTION, value: "1"}
      - {key: DATABASE_URL, sync: false}
      - {key: SECRET_KEY, generateValue: true}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_SERVICE_KEY, sync: false}
      - {key: SUPABASE_BUCKET, value: uploads}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: ADMIN_PASSWORD, sync: false}
